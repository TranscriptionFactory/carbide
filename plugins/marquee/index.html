<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marquee</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="carbide-plugin-api.js"></script>
  </head>
  <body>
    <div class="marquee">
      <div class="marquee__viewport" id="viewport">
        <div class="marquee__track" id="track"></div>
      </div>
      <div class="marquee__footer">
        <span class="marquee__status" id="status">Loading…</span>
        <button class="marquee__refresh" id="refresh" type="button">
          Refresh
        </button>
      </div>
    </div>

    <script type="module">
      import {
        BASE_ROW_LIMIT,
        POOL_LIMIT,
        build_rows,
        build_section_filter,
        build_task_filter,
        merge_note_sets,
        normalize_settings,
        parse_tag_list,
        row_open_payload,
        select_rows,
        track_copies,
      } from "./marquee_logic.js";

      const NOTE_SET_TTL_MS = 60000;
      const MIN_REFRESH_INTERVAL_MS = 5000;
      const EVENT_DEBOUNCE_MS = 1500;
      const VAULT_EVENTS = [
        "file-modified",
        "note-indexed",
        "file-deleted",
        "file-renamed",
      ];
      const STATUS_GLYPHS = { todo: "[ ]", doing: "[-]", done: "[x]" };

      const viewport = document.getElementById("viewport");
      const track = document.getElementById("track");
      const status_el = document.getElementById("status");
      const refresh_button = document.getElementById("refresh");

      const dark_query = window.matchMedia("(prefers-color-scheme: dark)");
      const reduce_motion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );

      let settings = normalize_settings(null);
      let note_paths = null;
      let note_sets_at = 0;
      let note_sets_signature = null;
      let notes_changed = true;
      let last_refresh_at = 0;
      let debounce_timer = null;
      let rendered_signature = null;
      let rendered_group = null;
      let track_copy_count = 0;
      let poll_timer = null;
      let poll_seconds = null;

      function note_filter_signature() {
        return [
          settings.tags,
          settings.base_property,
          settings.base_operator,
          settings.base_value,
        ].join("\u0000");
      }

      function apply_theme() {
        const theme =
          settings.theme === "auto"
            ? dark_query.matches
              ? "dark"
              : "light"
            : settings.theme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      }

      async function resolve_note_paths() {
        const sets = [];

        const tags = parse_tag_list(settings.tags);
        if (tags.length > 0) {
          sets.push(
            ...(await Promise.all(tags.map((tag) => carbide.search.tags(tag)))),
          );
        }

        if (settings.base_property) {
          const results = await carbide.metadata.query({
            filters: [
              {
                property: settings.base_property,
                operator: settings.base_operator,
                value: settings.base_value,
              },
            ],
            sort: [],
            limit: BASE_ROW_LIMIT,
            offset: 0,
          });
          sets.push(results.rows.map((row) => row.note.path));
        }

        return merge_note_sets(sets);
      }

      function note_basename(note_path) {
        const name = note_path.split("/").pop() ?? note_path;
        return name.replace(/\.md$/, "");
      }

      function today_iso() {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${now.getFullYear()}-${month}-${day}`;
      }

      function build_meta(row, show_note_name) {
        const parts = [];
        if (show_note_name) parts.push(note_basename(row.path));
        if (row.kind === "section") {
          if (row.heading_path) parts.push(row.heading_path);
        } else if (row.due_date) {
          parts.push(`due ${row.due_date}`);
        }
        if (parts.length === 0) return null;

        const meta = document.createElement("span");
        meta.className = "marquee__meta";
        if (
          row.kind === "task" &&
          row.due_date &&
          row.status !== "done" &&
          row.due_date < today_iso()
        ) {
          meta.classList.add("is-overdue");
        }
        meta.textContent = parts.join(" · ");
        return meta;
      }

      function build_glyph(row) {
        const glyph = document.createElement("span");
        glyph.className = "marquee__glyph";
        if (row.kind === "section") {
          glyph.dataset.kind = "section";
          glyph.textContent = `H${row.level}`;
        } else {
          glyph.dataset.status = row.status;
          glyph.textContent = STATUS_GLYPHS[row.status] ?? STATUS_GLYPHS.todo;
        }
        return glyph;
      }

      function build_row(row, show_note_name) {
        const element = document.createElement("button");
        element.type = "button";
        element.className = "marquee__item";
        element.dataset.kind = row.kind;
        element.dataset.path = row.path;
        if (row.kind === "section") {
          element.dataset.line = String(row.line_number);
        }
        element.title = `${note_basename(row.path)} — ${row.text}`;

        const text = document.createElement("span");
        text.className = "marquee__text";
        text.textContent = row.text;

        element.append(build_glyph(row), text);
        const meta = build_meta(row, show_note_name);
        if (meta) element.append(meta);
        return element;
      }

      function build_group(rows) {
        const group = document.createElement("div");
        group.className = "marquee__group";
        for (const row of rows) {
          group.append(build_row(row, settings.show_note_name));
        }
        return group;
      }

      function clone_group(group) {
        const clone = group.cloneNode(true);
        // Clones fill part of the panel for most of every loop, so their
        // rows must stay clickable; aria-hidden and tabindex keep the
        // duplicates out of the a11y tree and the tab order.
        clone.setAttribute("aria-hidden", "true");
        for (const button of clone.querySelectorAll("button")) {
          button.tabIndex = -1;
        }
        return clone;
      }

      function fill_track() {
        if (rendered_group === null) return;
        const copies = track_copies(
          rendered_group.offsetHeight,
          viewport.clientHeight,
        );
        if (copies === track_copy_count) return;
        track_copy_count = copies;
        const clones = Array.from({ length: copies - 1 }, () =>
          clone_group(rendered_group),
        );
        track.replaceChildren(rendered_group, ...clones);
        track.style.setProperty("--marquee-copies", String(copies));
      }

      function update_static_state(count) {
        viewport.classList.toggle(
          "marquee--static",
          count === 0 || reduce_motion.matches,
        );
      }

      function rows_label(rows) {
        const sections = rows.filter((row) => row.kind === "section").length;
        if (sections === 0) return "task";
        if (sections === rows.length) return "section";
        return "row";
      }

      function update_status(rows) {
        if (rows.length === 0) {
          // A task-only panel keeps its original copy; the sections pool is
          // configured only when a section setting is set.
          status_el.textContent = build_section_filter(settings)
            ? "Nothing matches these filters"
            : "No tasks match this filter";
          return;
        }
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const label = rows_label(rows);
        status_el.textContent = `${rows.length} ${label}${rows.length === 1 ? "" : "s"} · updated ${hours}:${minutes}`;
      }

      function render_signature(rows) {
        const items = rows.map(
          (row) =>
            `${row.kind}|${row.id}|${row.status}|${row.due_date}|${row.text}|${row.path}|${row.line_number}|${row.heading_path}|${row.level}`,
        );
        return [
          settings.show_note_name,
          settings.scroll_seconds,
          items.join("\n"),
        ].join("\n");
      }

      function render(rows) {
        const signature = render_signature(rows);
        if (signature !== rendered_signature) {
          rendered_signature = signature;

          rendered_group = build_group(rows);
          track_copy_count = 0;
          track.replaceChildren(rendered_group);
          viewport.style.setProperty(
            "--marquee-duration",
            `${settings.scroll_seconds}s`,
          );
          fill_track();
          update_static_state(rows.length);
        }
        update_status(rows);
      }

      function apply_poll_interval() {
        if (poll_seconds === settings.poll_seconds) return;
        if (poll_timer !== null) clearInterval(poll_timer);
        poll_seconds = settings.poll_seconds;
        poll_timer = setInterval(tick, poll_seconds * 1000);
      }

      async function refresh() {
        last_refresh_at = Date.now();
        try {
          settings = normalize_settings(
            await carbide.settings.getAll().catch(() => ({})),
          );
          apply_theme();
          apply_poll_interval();

          const note_filter = note_filter_signature();
          if (
            notes_changed ||
            note_filter !== note_sets_signature ||
            last_refresh_at - note_sets_at >= NOTE_SET_TTL_MS
          ) {
            note_paths = await resolve_note_paths();
            note_sets_at = Date.now();
            note_sets_signature = note_filter;
            notes_changed = false;
          }

          // A section filter that is off issues no RPC at all, so a task-only
          // panel behaves exactly as it did before sections existed.
          const section_filter = build_section_filter(settings);
          const sections = section_filter
            ? await carbide.sections.query(section_filter)
            : [];
          const tasks = await carbide.tasks.query({
            filter: build_task_filter(settings),
            sort: [],
            limit: POOL_LIMIT,
            offset: 0,
          });
          render(
            select_rows(
              build_rows(tasks, sections),
              note_paths,
              settings.max_items,
            ),
          );
        } catch (error) {
          status_el.textContent = `Refresh failed: ${error?.message ?? error}`;
        }
      }

      function tick() {
        if (window.innerWidth === 0) return;
        if (Date.now() - last_refresh_at < MIN_REFRESH_INTERVAL_MS) return;
        void refresh();
      }

      function schedule_refresh() {
        notes_changed = true;
        if (debounce_timer !== null) clearTimeout(debounce_timer);
        debounce_timer = setTimeout(() => {
          debounce_timer = null;
          // `tick` keeps a burst of vault events from outrunning the plugin
          // call rate limit; a skipped event refresh is picked up by the poll.
          tick();
        }, EVENT_DEBOUNCE_MS);
      }

      function row_from_element(element) {
        const line = element.dataset.line;
        return {
          kind: element.dataset.kind,
          path: element.dataset.path,
          line_number: line === undefined ? 0 : Number(line),
        };
      }

      function open_row(element) {
        // The host reads params[1] as the argument array, so the payload goes
        // in as a single array element.
        carbide.actions.execute("note.open", [
          row_open_payload(row_from_element(element)),
        ]);
      }

      track.addEventListener("click", (event) => {
        const row = event.target.closest(".marquee__item");
        if (row) open_row(row);
      });

      refresh_button.addEventListener("click", () => void refresh());

      new ResizeObserver(() => fill_track()).observe(viewport);
      reduce_motion.addEventListener("change", () => {
        update_static_state(rendered_group?.childElementCount ?? 0);
      });

      dark_query.addEventListener("change", () => {
        if (settings.theme === "auto") apply_theme();
      });

      carbide.onload(async () => {
        settings = normalize_settings(
          await carbide.settings.getAll().catch(() => ({})),
        );
        apply_theme();

        // Registering the panel fails while its permission is still pending;
        // the poll and event wiring below must survive that. The pending state
        // is already surfaced by the plugin manager and by the refresh status.
        await carbide.ui
          .addSidebarPanel({
            id: "panel",
            label: "Marquee",
            icon: "check-circle",
          })
          .catch(() => {});

        for (const event_type of VAULT_EVENTS) {
          carbide.events.on(event_type, () => schedule_refresh());
        }

        await refresh();
      });
    </script>
  </body>
</html>
